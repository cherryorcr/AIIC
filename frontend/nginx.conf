server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    # Model-backed evaluation can take longer than the default nginx 60s
    # upstream timeout, especially while falling back from a hosted provider
    # to the GPU server. Keep the request open long enough for one turn.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'frontend ok\n';
  }
}
