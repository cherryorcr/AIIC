<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIIC Challenge Demo</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f3f5f7; color: #17212b; }
      main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      .sub { margin: 0 0 24px; color: #5b6875; }
      .panel { background: #fff; border: 1px solid #dbe1e6; border-radius: 8px; padding: 20px; box-shadow: 0 8px 24px rgba(25, 45, 65, .06); }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      textarea { display: block; width: 100%; min-height: 130px; resize: vertical; border: 1px solid #bec8d2; border-radius: 6px; padding: 12px; font: inherit; line-height: 1.5; }
      textarea:focus { outline: 2px solid #86b7fe; border-color: #4b92e5; }
      .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
      button { border: 0; border-radius: 6px; background: #1769e0; color: #fff; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      .result { margin-top: 18px; min-height: 80px; white-space: pre-wrap; line-height: 1.6; background: #f8fafc; border: 1px solid #e1e7ed; border-radius: 6px; padding: 14px; }
      .status { margin-top: 10px; color: #5b6875; font-size: 14px; }
      .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <h1>AIIC Challenge Demo</h1>
      <p class="sub">最小可用的大模型对话链路演练</p>
      <section class="panel">
        <label for="question">输入问题</label>
        <textarea id="question" placeholder="例如：用一句话解释量子纠缠"></textarea>
        <div class="actions"><button id="send" type="button">发送</button></div>
        <div id="status" class="status" role="status"></div>
        <div id="result" class="result" aria-live="polite">模型回复会显示在这里</div>
      </section>
    </main>
    <script>
      const question = document.querySelector('#question');
      const send = document.querySelector('#send');
      const status = document.querySelector('#status');
      const result = document.querySelector('#result');

      async function ask() {
        const value = question.value.trim();
        if (!value) { status.textContent = '请输入问题'; status.className = 'status error'; return; }
        send.disabled = true;
        status.textContent = '正在请求模型…';
        status.className = 'status';
        result.textContent = '';
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: value }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）`);
          result.textContent = data.answer;
          status.textContent = '完成';
        } catch (error) {
          result.textContent = '';
          status.textContent = error.message;
          status.className = 'status error';
        } finally {
          send.disabled = false;
        }
      }

      send.addEventListener('click', ask);
      question.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') ask();
      });
    </script>
  </body>
</html>
