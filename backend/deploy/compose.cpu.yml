services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    # The frontend is the only public application port; it proxies /api to the
    # private backend container on the compose network.
    ports:
      - "8080:80"
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Lets the backend container reach the host-side SSH reverse tunnel to
      # the private GPU server without exposing the model port publicly.
      # The project network gateway is stable for this deployment and is the
      # only address on which the reverse tunnel listens.
      - "host.docker.internal:172.18.0.1"
    environment:
      DATABASE_PATH: /app/data/app.db
      DATABASE_URL: ${DATABASE_URL:-postgresql://interview:interview@postgres:5432/interview}
      # Production/demo default: the approved, provenance-tracked public set.
      # Keep synthetic_mock data available in the repository, but never seed it
      # by accident in the deployed service.
      INTERVIEW_DATASET_PATH: /app/data/approved-dataset.json
    volumes:
      - interview_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interview_data:
  postgres_data:
